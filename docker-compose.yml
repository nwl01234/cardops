name: cardops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cardops
      POSTGRES_PASSWORD: cardops
      POSTGRES_DB: cardops
    volumes:
      - cardops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cardops -d cardops']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_URL: postgres://cardops:cardops@postgres:5432/cardops
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a unique value of at least 32 characters}
      JWT_TTL_MINUTES: 480
      WEB_ORIGIN: http://localhost:3000
      COOKIE_SECURE: 'false'
      ALLOW_INSECURE_COOKIE: 'true'
      TRUST_PROXY: 'true'
      SEED_DEMO: 'true'
      LOG_LEVEL: info
      OUTBOX_POLL_MS: 1000
      LOGIN_RATE_LIMIT: 10
      LOGIN_RATE_WINDOW_MINUTES: 15
      APP_VERSION: 0.1.0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    ports:
      - '127.0.0.1:8787:8787'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:80'

volumes:
  cardops_pg:
